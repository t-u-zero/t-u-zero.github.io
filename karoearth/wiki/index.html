<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>かろEarth Wiki</title>

    <link rel="stylesheet" href="../style.css">
    <script src="../script.js" defer></script>
</head>

<body data-page="wiki" data-site-root="../">

    <div class="page-loader" role="status" aria-live="polite">
        <span class="page-loader-mark">KE</span>
        <span class="page-loader-label">Loading...</span>
        <span class="page-loader-spinner" aria-hidden="true"></span>
        <span class="page-loader-progress" aria-hidden="true">
            <span></span>
        </span>
    </div>

    <main class="simple-page">
        <section class="simple-panel" aria-labelledby="wiki-title">
            <p class="eyebrow">KAROEARTH WIKI</p>
            <h1 id="wiki-title">Wikiは準備中です</h1>
            <p>
                ワールド情報や遊び方をまとめるページとして使えるよう、入口だけ先に用意しています。
            </p>
            <a class="button primary" href="../">トップへ戻る</a>
        </section>
    </main>

</body>

</html>
